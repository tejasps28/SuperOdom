/**:
  ros__parameters:
    # TartanAir ROS2 topics
    imu_topic: "/tartanair/imu"
    laser_topic: "/tartanair/velodyne"
    odom_topic: "/tartanair/visual_odometry"
    sensor: "velodyne"
    use_imu_roll_pitch: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "sensor"
    sensor_frame_rot: "sensor_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    # IMPORTANT:
    # false -> use camera-lidar + imu-camera transforms from calibration YAML
    # true  -> use imu-lidar transform only
    provide_imu_laser_extrinsic: false

    # Feature Extraction Params
    feature_extraction_node:
        scan_line: 16
        min_range: 0.2
        max_range: 130.0
        filter_point_size: 2
        mapping_skip_frame: 1
        provide_point_time: 0
        # Toggle visual deskew usage inside feature extraction.
        # false = IMU-only deskew path.
        use_visual_deskew: false

    # Laser Mapping Params
    laser_mapping_node:
        mapping_line_resolution: 0.1
        mapping_plane_resolution: 0.2
        max_iterations: 5
        max_surface_features: 2000
        # Master toggle for VIO prediction usage in fusion.
        # false = VIO path disabled, LIO/IMU fallback only.
        enable_visual_fusion: false
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0

    # IMU Preintegration Params
    imu_preintegration_node:
        lidar_correction_noise: 0.01
        acc_n: 3.9939570888238808e-03
        gyr_n: 1.5636343949698187e-03
        acc_w: 6.4356659353532566e-05
        gyr_w: 3.5640318696367613e-05
        g_norm: 9.80511

    # Visual Odometry Params
    visual_odometry_node:
        image_topic: "/tartanair/image_left/image"
        camera_info_topic: "/tartanair/image_left/camera_info"
        odom_topic: "/tartanair/visual_odometry"
        frame_id: "map"
        child_frame_id: "sensor"
        max_features: 1200
        min_tracked_features: 120
        min_inliers: 60
        max_lost_frames: 5
        ransac_threshold_px: 1.5
        # monocular VO scale factor; set from your dataset scale policy
        translation_scale: 0.0
        # ORB-style runtime observability for VO.
        publish_debug_topics: true
        publish_debug_image: true
        debug_image_topic: "/SuperOdom/vo_debug_image"
